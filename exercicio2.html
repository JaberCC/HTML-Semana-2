<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
</head>
<body>

    <header><h3>Conte-nos sua experência</h3>
    </header>
    <form action="/enviar" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome"name="nome"maxlength="30" required>
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email"id="email"required>
        <br><br>
        <label for="comentario">Seus comentários</label><br>
        <textarea name="comentario" id="comentario" rows="5" cols="35"></textarea>
        <br>
        
        <label for="notas"><h4>Avalie nosso atendimento</h4></label>
        <select name="nota" id="notas">
            <option value="1">Péssimo</option>
            <option value="2">Ruim</option>
            <option value="3">Bom</option>
            <option value="4">Muito bom</option>
            <option value="5">Excelente</option>
        </select><br><br><br>
        <button type="reset">Limpar</button>
        <button type="submit">Enviar</button>
        
    </form>
</body>
</html>
